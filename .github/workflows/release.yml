name: Build oh-my-posh for Debian

on:
  workflow_dispatch:
    inputs:
      oh_my_posh_version:
        description: The version of oh-my-posh to build (without the leading v).
        type: string
        required: true
      build_version:
        description: The build version.
        type: string
        required: true
      architecture:
        description: Architecture to build (amd64, arm64, armhf, or 'all' for all architectures)
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'amd64'
          - 'arm64'
          - 'armhf'

permissions:
  contents: write

jobs:
  build-oh-my-posh:
    name: Build Binary Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oh-my-posh-debian
        uses: actions/checkout@v4

      - name: Build oh-my-posh
        run: ./build_debian.sh ${{ inputs.oh_my_posh_version }} ${{ inputs.build_version }} ${{ inputs.architecture }} && ./build_ubuntu.sh ${{ inputs.oh_my_posh_version }} ${{ inputs.build_version }} ${{ inputs.architecture }}

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-artifact
          path: oh-my-posh_*.deb

  build-src:
    name: Build Source Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oh-my-posh-debian
        uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev devscripts wget ca-certificates

      - name: Build source packages
        run: ./build_src.sh ${{ inputs.oh_my_posh_version }} ${{ inputs.build_version }}

      - name: Upload Source Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-artifact
          path: |
            oh-my-posh_*.dsc
            oh-my-posh_*.orig.tar.gz
            oh-my-posh_*.debian.tar.xz

  release-oh-my-posh:
    name: Release oh-my-posh for Debian
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-oh-my-posh, build-src]
    steps:
      - name: Download Binary Artifacts
        uses: actions/download-artifact@v4
        with:
          name: binary-artifact

      - name: Download Source Artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-artifact

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            oh-my-posh_*.deb
            oh-my-posh_*.dsc
            oh-my-posh_*.orig.tar.gz
            oh-my-posh_*.debian.tar.xz
          name: ${{ inputs.oh_my_posh_version }}+${{ inputs.build_version }}
          tag_name: ${{ inputs.oh_my_posh_version }}+${{ inputs.build_version }}
          fail_on_unmatched_files: true
